<style>

.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}label{display:block;font-size:12px}label input,label select{width:100%;display:block}
table{width:100%;border-collapse:collapse;background:var(--cd)}th,td{border:1px solid var(--bd);padding:4px 6px;font-size:13px}th{background:#0d948833}.n{text-align:right}
.it{padding:6px;border:1px solid var(--bd);cursor:pointer;background:var(--cd)}.it:hover{background:var(--pr);color:#fff}
#md{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:9}.box{background:var(--cd);padding:16px;border-radius:12px;width:min(520px,94vw);max-height:90vh;overflow:auto}
.toast{position:fixed;top:16px;right:16px;background:#16a34a;color:#fff;padding:12px 18px;border-radius:10px;z-index:99;animation:pop .4s,out .4s 2s forwards;display:flex;gap:8px;align-items:center}

.ch{display:flex;gap:6px;align-items:flex-end;height:160px;overflow-x:auto}.ch div{display:flex;gap:2px;align-items:flex-end;height:100%;flex-direction:column;justify-content:flex-end}.ch .bb{display:flex;flex-direction:row;align-items:flex-end;height:140px}.ch i{width:10px;display:block;border-radius:3px 3px 0 0}
.kop{display:flex;gap:12px;align-items:center;justify-content:center;text-align:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:8px}.kop h3{margin:2px 0}
.ttr{display:flex;justify-content:space-between;margin-top:18px;text-align:center}.tt{min-width:200px;position:relative;z-index:0}.sg{height:42px;position:relative}.sg img{position:absolute;left:50%;top:-4px;height:56px;transform:translateX(-50%);z-index:-1;opacity:.8}.tt b{display:block;margin-top:-10px}

.kw td{border:0;padding:1px 3px;vertical-align:top;font-size:10pt;color:#000}.kw table{background:#fff}.kg{display:grid;grid-template-columns:1fr 1fr;text-align:center;margin-top:auto}.kg>div{position:relative;z-index:0}.kg .sg{height:30px}.kg b{margin-top:-14px}
@page{size:A4;margin:1cm}
.kgr{display:grid;grid-template-columns:9cm 9cm;gap:.4cm 1cm;justify-content:start}
.ktc{z-index:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;width:9cm;height:5cm;border:1.5px solid #0d9488;border-radius:8px;padding:.2cm;position:relative;overflow:hidden;font-size:8pt;break-inside:avoid;background:#fff;color:#000}.ktc table{background:none;width:auto}.ktc td{border:0;padding:0 2px;font-size:9pt}
.kh2{display:flex;gap:6px;align-items:center;border-bottom:1px solid #000;font-size:7.5pt;text-align:center;margin-bottom:3px}.kh2 img{height:.9cm}.kh2 div{flex:1}.kbc{position:absolute;left:.25cm;bottom:.15cm;line-height:1}
.kts{z-index:0;position:absolute;right:.25cm;bottom:.1cm;text-align:center;font-size:7pt;width:4cm}.sgk{height:.75cm;position:relative}.sgk img{position:absolute;left:50%;transform:translateX(-50%);height:1cm;top:-.1cm;z-index:-1;opacity:.8}.kts b{position:relative;z-index:1;display:block;margin-top:-.15cm}
.cert{width:25.6cm;height:16.8cm;box-sizing:border-box;border:8px double #0f766e;position:relative;z-index:0;padding:.3cm .8cm;text-align:center;background:#fff!important;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:14pt;display:flex;flex-direction:column;justify-content:space-between;align-items:center}.cert *{color:#134e4a!important}
.cert h1{margin:0;font-size:38px;letter-spacing:3px}.cert h2{margin:0;font-size:36px;border-bottom:2px solid #0f766e;display:inline-block;padding:0 30px}.cert p{margin:2px}.cert .sl{font-weight:700;font-size:17px;margin:4px}.cert .ttr{margin-top:0;width:100%}.cert .tt b{margin-top:-14px}
@media print{aside,header,.np,#md,.toast{display:none!important}html,body{height:auto;display:block;background:#fff!important}#mn{display:block}main{overflow:visible;padding:0}*{color:#000!important;background:transparent!important}
body.pk>*:not(#kwb){display:none!important}body.pk #kwb{position:static}.card{border:0}}
@media(max-width:700px){aside{width:52px}aside a span{display:none}.two{grid-template-columns:1fr}}
.kwrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.kl{width:300px;flex:none;max-height:78vh;overflow:auto}@media print{.kwrap{display:block}}
.sc{color:#fff;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 3px 10px #0003;transition:.2s}.sc:hover{transform:translateY(-3px)}.sc b{display:block;font-size:20px;color:#fff}.sc i{font-size:34px;font-style:normal}
.c1{background:linear-gradient(135deg,#0d9488,#059669)}.c2{background:linear-gradient(135deg,#2563eb,#4f46e5)}.c3{background:linear-gradient(135deg,#16a34a,#65a30d)}.c4{background:linear-gradient(135deg,#dc2626,#ea580c)}.c5{background:linear-gradient(135deg,#7c3aed,#c026d3)}.c6{background:linear-gradient(135deg,#db2777,#e11d48)}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}.col>.card{flex:1}.dch{display:flex;gap:6px;align-items:flex-end;height:220px;margin-top:8px}.dch>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.dch .bb{display:flex;gap:2px;align-items:flex-end;height:190px}.dch i{display:block;width:10px;border-radius:4px 4px 0 0}
.tls{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-top:8px}.tl{color:#fff;border-radius:10px;padding:8px;text-align:center;font-size:12px}.tl b{font-size:16px}
.bd{padding:2px 8px;border-radius:99px;color:#fff;font-size:12px}.bs{background:#16a34a}.bt{background:#dc2626}
#app[data-pg=siswa] tbody tr:nth-child(even),#app[data-pg=masuk] tbody tr:nth-child(even),#app[data-pg=riw] tbody tr:nth-child(even){background:#0d948826}
#app[data-pg=siswa] tbody tr:hover,#app[data-pg=masuk] tbody tr:hover,#app[data-pg=riw] tbody tr:hover{background:#0d948844}
.tt>div:first-child{white-space:nowrap;line-height:1.4;min-height:2.8em}.tt{min-width:250px}
</style></head><body>
<aside id="sb"></aside><div id="mn"><header class="np" id="hd"></header><main id="app"></main></div><div id="md"></div><div id="kwb"></div>
<script>
const $=s=>document.querySelector(s),g=i=>(document.getElementById(i)||{}).value||'',M=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const KL=[1,2,3,4,5,6].flatMap(n=>['A','B'].map(c=>n+c));
const def=()=>({pw:'admin',set:{nama:'MIN 2 Tasikmalaya',alamat:'Kabupaten Tasikmalaya',kepala:'',nipk:'',bend:'',nipb:'',tempat:'Tasikmalaya',logo:'',ttdk:'',ttdb:''},siswa:[],trx:[],seq:1});
let S,role='pub',Y=2026,pg='dash',pre='',curB=null,cur=null,fill=()=>{};
try{S=JSON.parse(localStorage.getItem('tabsis'))}catch(e){}S=S||def();
const save=()=>{try{localStorage.setItem('tabsis',JSON.stringify(S))}catch(e){}};
const rp=n=>'Rp '+(+n||0).toLocaleString('id-ID'),cap=t=>t.replace(/\b\w/g,c=>c.toUpperCase());
const tgl=d=>{if(!d)return'';const[y,m,x]=d.split('-');return x+' '+M[m-1]+' '+y};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ay=d=>{const[y,m]=d.split('-');return +m>=7?+y:y-1};
const st=id=>S.siswa.find(s=>s.id==id),lvY=(s,y)=>{let n=+s.kelas[0];for(let i=s.th+1;i<=y;i++)if((S.naik||{})[i])n++;return n},lv=s=>lvY(s,Y),kn=s=>lv(s)+s.kelas[1],act=s=>Y>=s.th&&lv(s)>=1&&lv(s)<=6;
const T=(s,f)=>S.trx.filter(t=>t.sid==s.id&&f(t)),sum=a=>a.reduce((x,t)=>x+t.jml,0),srt=(a,c)=>a.tgl<c.tgl?-1:a.tgl>c.tgl?1:a.id-c.id;
const b0=s=>s.awal+sum(T(s,t=>t.j=='S'&&ay(t.tgl)<Y))-sum(T(s,t=>t.j=='T'&&ay(t.tgl)<Y));
const inY=(s,j)=>sum(T(s,t=>t.j==j&&ay(t.tgl)==Y)),sal=s=>b0(s)+inY(s,'S')-inY(s,'T');
const sorted=()=>S.siswa.filter(act).sort((a,b)=>a.nama.localeCompare(b.nama));
const mt=s=>{const q=g('q').toLowerCase(),k=g('k');return(!q||s.nama.toLowerCase().includes(q)||s.nis.includes(q))&&(!k||kn(s)==k)};
function tb(n){const s=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
if(n<12)return s[n];if(n<20)return tb(n-10)+' belas';if(n<100)return tb(n/10|0)+' puluh'+(n%10?' '+tb(n%10):'');if(n<200)return'seratus'+(n%100?' '+tb(n-100):'');
if(n<1e3)return tb(n/100|0)+' ratus'+(n%100?' '+tb(n%100):'');if(n<2e3)return'seribu'+(n%1e3?' '+tb(n-1e3):'');if(n<1e6)return tb(n/1e3|0)+' ribu'+(n%1e3?' '+tb(n%1e3):'');
if(n<1e9)return tb(n/1e6|0)+' juta'+(n%1e6?' '+tb(n%1e6):'');return tb(n/1e9|0)+' miliar'+(n%1e9?' '+tb(n%1e9):'')}
const tbr=n=>n>0?cap(tb(Math.floor(n)))+' Rupiah':'';
function toast(m,ok=1){const d=document.createElement('div');d.className='toast';if(!ok)d.style.background='#dc2626';d.innerHTML=`<span class="ck">${ok?'✓':'!'}</span>${m}`;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
const modal=h=>{$('#md').innerHTML=`<div class="box">${h}</div>`;$('#md').style.display='flex'},cm=()=>$('#md').style.display='none';
const kop=()=>`<div class="kop">${S.set.logo?`<img src="${S.set.logo}" style="height:70px">`:''}<div><b>KEMENTERIAN AGAMA REPUBLIK INDONESIA<br>KABUPATEN TASIKMALAYA</b><h3>${S.set.nama.toUpperCase()}</h3><small>${S.set.alamat}</small></div></div>`;
const ttd=()=>{const s=S.set,b=(l,n,nip,i)=>`<div class="tt"><div>${l}</div><div class="sg">${i?`<img src="${i}">`:''}</div><b><u>${n||'........'}</u></b><div>NIP. ${nip||'-'}</div></div>`;return`<div class="ttr">${b('Mengetahui,<br>Kepala Madrasah',s.kepala,s.nipk,s.ttdk)}${b(s.tempat+', '+tgl(today())+'<br>Bendahara',s.bend,s.nipb,s.ttdb)}</div>`};
const MN=[['dash','📊','Dashboard',0],['siswa','🎓','Data Siswa',0],['masuk','💰','Kas Masuk',1],['keluar','💸','Kas Keluar',1],['riw','🧾','Riwayat Transaksi',0],['buku','📒','Buku Tabungan',0],['lap','📑','Laporan Transaksi',0],['kartu','🪪','Kartu Pelajar',1],['rekap','🧮','Rekap Siswa',0],['rkls','🏫','Rekap Kelas',0],['naik','⬆️','Kenaikan Kelas',1],['juara','🏆','Kejuaraan Nabung',0],['set','⚙️','Pengaturan',1]];
const ad=()=>role=='admin',yopt=()=>{let m=Math.max(2026,ay(today())+2),o='';for(let y=2026;y<=m;y++)o+=`<option value="${y}" ${y==Y?'selected':''}>${y}/${y+1}</option>`;return o};
function nav(){$('#sb').innerHTML=`<h1>🏦 Tabungan Siswa<br>${S.set.nama}</h1>`+MN.filter(m=>ad()||!m[3]).map(m=>`<a class="${pg==m[0]?'on':''}" onclick="go('${m[0]}')">${m[1]}<span>${m[2]}</span></a>`).join('');
$('#hd').innerHTML=`<b id="clk"></b><span>TP <select onchange="Y=+this.value;go(pg)">${yopt()}</select> ${ad()?'👤 Admin <button class="g" onclick="lo()">Keluar</button>':'👁️ Publik <button onclick="lg()">🔐 Login Admin</button>'}</span>`}
function go(p){if(!ad()&&MN.find(m=>m[0]==p)[3])p='dash';pg=p;$('#app').dataset.pg=p;nav();PG[p]()}
setInterval(()=>{const c=$('#clk');if(c)c.textContent=tgl(today())+' • '+new Date().toLocaleTimeString('id-ID')},1000);
const lo=()=>{role='pub';go('dash')};
function lg(){modal(`<h3>🔐 Login Admin</h3><label>Username<input id="lu"></label><label>Password<input id="lp" type="password"></label><label>Tahun Pelajaran<select id="ly">${yopt()}</select></label><div class="bar" style="margin-top:10px"><button onclick="dl()">Masuk</button><button class="g" onclick="lf()">Lupa password</button><button class="g" onclick="cm()">Batal</button></div>`)}
function dl(){if(g('lu')=='admin'&&g('lp')==S.pw){role='admin';Y=+g('ly');cm();toast('Login berhasil');go('dash')}else toast('Username/password salah',0)}
function lf(){const c=prompt('Masukkan NSM untuk reset password:');if(c==='111132060003'){S.pw='admin';save();toast('Password direset ke: admin')}else if(c!==null)toast('NSM salah',0)}
const fbar=(o='')=>`<div class="bar np"><input id="q" placeholder="🔍 Cari nama/NIS" oninput="fill()" value="${pre}"><select id="k" onchange="fill()"><option value="">Semua Kelas</option>${KL.map(k=>`<option>${k}</option>`).join('')}</select>${o}<button class="g" onclick="pre='';go(pg)" title="Reset">↺</button></div>`;
const ex=(rows,name)=>{if(!window.XLSX)return toast('Pustaka Excel belum termuat',0);const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet(rows),'Data');XLSX.writeFile(w,name+'.xlsx')};
const PG={};
PG.dash=()=>{const A=sorted(),td=today(),ti=sum(S.trx.filter(t=>t.j=='S'&&t.tgl==td)),to=sum(S.trx.filter(t=>t.j=='T'&&t.tgl==td)),tS=A.reduce((x,s)=>x+inY(s,'S'),0),tT=A.reduce((x,s)=>x+inY(s,'T'),0);
const D=KL.map(k=>{const s=A.filter(x=>kn(x)==k);return[k,s.reduce((x,y)=>x+inY(y,'S'),0),s.reduce((x,y)=>x+inY(y,'T'),0),s.length,s.reduce((x,y)=>x+sal(y),0)]}),mx=Math.max(1,...D.flatMap(d=>[d[1],d[2]])),J=jr(),M3=['🥇','🥈','🥉'],CL=['#0d9488','#2563eb','#7c3aed','#db2777','#ea580c','#ca8a04'];
const sc=(c,i,l,v)=>`<div class="sc ${c}"><i>${i}</i><div>${l}<b>${v}</b></div></div>`;
$('#app').innerHTML=`<h2>📊 Dashboard <button class="g" onclick="go('dash')">🔄 Segarkan</button></h2>${ad()?`<div class="bar"><button onclick="go('masuk')">💰 Kas Masuk</button><button class="r" onclick="go('keluar')">💸 Kas Keluar</button></div>`:''}
<div class="grid">${sc('c1','💰','Total Saldo Tabungan',rp(A.reduce((x,s)=>x+sal(s),0)))}${sc('c2','🎓','Siswa Aktif',A.length)}${sc('c3','📥','Setoran Hari Ini',rp(ti))}${sc('c4','📤','Penarikan Hari Ini',rp(to))}</div>
<div class="two"><div class="col"><div class="card"><b>📊 Pemasukan <span style="color:#16a34a">■</span> vs Penarikan <span style="color:#dc2626">■</span> per Kelas</b><div class="dch">${D.map(d=>`<div><span class="bb"><i title="${rp(d[1])}" style="height:${d[1]/mx*180}px;background:linear-gradient(#22c55e,#15803d)"></i><i title="${rp(d[2])}" style="height:${d[2]/mx*180}px;background:linear-gradient(#f87171,#b91c1c)"></i></span><small>${d[0]}</small></div>`).join('')}</div></div>
<div class="card"><b>🏫 Ringkasan per Kelas</b><div class="tls">${D.map((d,i)=>`<div class="tl" style="background:${CL[i%6]}"><b>${d[0]}</b><br>${d[3]} siswa<br><small>${rp(d[4])}</small></div>`).join('')}</div></div></div>
<div class="col"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>🕒 Aktivitas Terbaru</b><button onclick="go('riw')">📋 Lihat Semua</button></div><table>${S.trx.slice(-5).reverse().map(t=>`<tr><td>${tgl(t.tgl)}</td><td>${(st(t.sid)||{}).nama||'-'}</td><td><span class="bd ${t.j=='S'?'bs':'bt'}">${t.j=='S'?'Setor':'Tarik'}</span></td><td class="n">${rp(t.jml)}</td></tr>`).join('')||'<tr><td>Belum ada transaksi</td></tr>'}</table></div>

const rs=()=>{if(sec()){S=def();save();toast('Data direset');go('dash')}};

const bY=(s,y)=>s.awal+sum(T(s,t=>ay(t.tgl)<y)),iY=(s,j,y)=>sum(T(s,t=>t.j==j&&ay(t.tgl)==y));let curR=null,sel=new Set,kd=today();
const c39={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','*':'nwnnwnwnn'};
const bc=v=>{let x=0,r='';('*'+v.replace(/\D/g,'')+'*').split('').forEach(ch=>{c39[ch].split('').forEach((w,i)=>{const d=w=='w'?2.4:1;if(i%2==0)r+=`<rect x="${x}" width="${d}" height="26" fill="#000"/>`;x+=d});x+=1});return`<svg viewBox="0 0 ${x} 26" style="width:${Math.min(x*.9,150)}px;height:30px" preserveAspectRatio="none">${r}</svg>`};
const cardH=(s,d)=>{const c=S.set;return`<div class="ktc"><svg viewBox="0 0 340 190" preserveAspectRatio="xMidYMid slice" style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1"><circle cx="330" cy="0" r="120" fill="#10b981" opacity=".25"/><circle cx="0" cy="190" r="110" fill="#14b8a6" opacity=".22"/><path d="M0 120Q90 80 180 130T340 100V190H0Z" fill="#22c55e" opacity=".22"/><circle cx="300" cy="150" r="45" fill="none" stroke="#059669" stroke-width="4" opacity=".3"/><circle cx="40" cy="60" r="25" fill="none" stroke="#0d9488" stroke-width="3" opacity=".25"/></svg><div class="kh2">${c.logo?`<img src="${c.logo}">`:''}<div><b>KARTU PELAJAR</b><br>${c.nama.toUpperCase()}<br><small>${c.alamat}</small></div></div><table><tr><td>NIS</td><td>: ${s.nis}</td></tr><tr><td>Nama</td><td>: ${s.nama}</td></tr><tr><td>Kelas</td><td>: ${kn(s)} (${Y}/${Y+1})</td></tr></table><div class="kbc">${bc(s.nis)}<br><small>${s.nis}</small></div><div class="kts">${c.tempat}, ${tgl(d)}<br>Kepala Madrasah<div class="sgk">${c.ttdk?`<img src="${c.ttdk}">`:''}</div><b>${c.kepala||'........'}</b></div></div>`};
PG.kartu=()=>{$('#app').innerHTML=`<h2>🪪 Kartu Pelajar</h2>${fbar(`<input type="date" id="kd" value="${kd}" onchange="kd=this.value;fill()"><button class="g" onclick="selAll(1)">☑️ Pilih Semua</button><button class="g" onclick="selAll(0)">Batal Pilih</button><button onclick="window.print()">🖨️ Cetak Kartu</button>`)}<div class="kwrap"><div id="ls" class="np card kl"></div><div><b class="np">Pratinjau Kartu Pelajar</b><div id="pa" class="kgr"></div></div></div>`;
fill=()=>{const L=sorted().filter(mt);$('#ls').innerHTML='<small>Centang siswa yang dicetak (tanpa centang = semua sesuai filter)</small><br>'+L.map(s=>`<label style="display:block;padding:2px 0"><input type="checkbox" style="width:auto;display:inline" ${sel.has(s.id)?'checked':''} onchange="tg2(${s.id})"> ${s.nama} (${kn(s)})</label>`).join('');$('#pa').innerHTML=(sel.size?L.filter(s=>sel.has(s.id)):L).map(s=>cardH(s,kd)).join('')};fill()};
const tg2=id=>{sel.has(id)?sel.delete(id):sel.add(id);fill()},selAll=f=>{sel=new Set(f?sorted().filter(mt).map(s=>s.id):[]);fill()};
PG.rekap=()=>{$('#app').innerHTML=`<h2>🧮 Rekap Tabungan Siswa</h2><div class="bar np"><input id="q" placeholder="🔍 Cari nama/NIS (min. 1 huruf)" oninput="pickL('rk2')"><button onclick="window.print()">🖨️ Cetak</button><button onclick="expR()">📤 Excel</button><button class="g" onclick="curR=null;PG.rekap()">↺</button></div><div id="ls" class="np"></div><div id="pa"></div>`;if(curR)showR()};
const rk2=id=>{curR=id;$('#ls').innerHTML='';showR()};
const rrows=s=>{let a=[];for(let L=1;L<=6;L++){let y=null;for(let i=s.th;i<=Y;i++)if(lvY(s,i)==L){y=i;break}a.push(y==null?[L,'-',0,0,0,0]:[L,y+'/'+(y+1),bY(s,y),iY(s,'S',y),iY(s,'T',y),bY(s,y)+iY(s,'S',y)-iY(s,'T',y)])}return a};
const showR=()=>{const s=st(curR);if(!s)return;const r=rrows(s),sm=i=>r.reduce((x,a)=>x+a[i],0);$('#pa').innerHTML=`<div class="card">${kop()}<h3 style="text-align:center;margin:4px">REKAP TABUNGAN SISWA</h3><p>NIS: ${s.nis} | Nama: <b>${s.nama}</b> | Kelas: ${kn(s)} | Tahun Pelajaran: ${Y}/${Y+1}</p><table><thead><tr><th>No</th><th>Jenjang Kelas</th><th>Tahun Pelajaran</th><th>Saldo Awal</th><th>Pemasukan</th><th>Penarikan</th><th>Saldo</th></tr></thead><tbody>${r.map((a,i)=>`<tr><td>${i+1}</td><td>Kelas ${a[0]}</td><td>${a[1]}</td>${a.slice(2).map(v=>`<td class="n">${rp(v)}</td>`).join('')}</tr>`).join('')}<tr><th colspan="4">Rekap Jumlah</th><th class="n">${rp(sm(3))}</th><th class="n">${rp(sm(4))}</th><th class="n">${rp(sal(s))}</th></tr></tbody></table><p><b>Saldo Terkini: ${rp(sal(s))}</b><br><i>Terbilang: ${tbr(sal(s))||'-'}</i></p>${ttd()}</div>`};
const expR=()=>{if(!curR)return toast('Pilih siswa dulu',0);ex([['Jenjang','TP','Saldo Awal','Pemasukan','Penarikan','Saldo'],...rrows(st(curR)).map(a=>['Kelas '+a[0],...a.slice(1)])],'rekap-siswa')};
const krows=()=>{const d1=g('d1'),d2=g('d2');return sorted().filter(mt).map(s=>{const p=j=>d1?sum(T(s,t=>t.j==j&&ay(t.tgl)==Y&&t.tgl<d1)):0,aw=b0(s)+p('S')-p('T'),f=j=>sum(T(s,t=>t.j==j&&ay(t.tgl)==Y&&(!d1||t.tgl>=d1)&&(!d2||t.tgl<=d2)));return[s,aw,f('S'),f('T'),aw+f('S')-f('T')]})};
PG.rkls=()=>{$('#app').innerHTML=`<h2>🏫 Rekap Tabungan Kelas</h2>${fbar(`${dts}<button onclick="window.print()">🖨️ Cetak</button><button onclick="expK()">📤 Excel</button>`)}<div id="pa" class="card">${kop()}<h3 style="text-align:center;margin:4px">REKAP TABUNGAN KELAS</h3><div id="idk"></div><table><thead><tr><th>No</th><th>NIS</th><th>Nama Siswa</th><th>Kelas</th><th>Saldo Bulan Lalu</th><th>Pemasukan</th><th>Penarikan</th><th>Saldo</th></tr></thead><tbody id="tb"></tbody></table><div id="fo"></div>${ttd()}</div>`;
fill=()=>{const R=krows(),sm=i=>R.reduce((x,a)=>x+a[i],0);$('#idk').innerHTML=`<p>Kelas: <b>${g('k')||'Semua Kelas'}</b> | Jumlah Siswa: <b>${R.length}</b> | Tahun Pelajaran: <b>${Y}/${Y+1}</b></p>`;$('#tb').innerHTML=R.map((a,i)=>`<tr><td>${i+1}</td><td>${a[0].nis}</td><td>${cap(a[0].nama.toLowerCase())}</td><td>${kn(a[0])}</td>${a.slice(1).map(v=>`<td class="n">${rp(v)}</td>`).join('')}</tr>`).join('')+`<tr><th colspan="4">Total</th>${[1,2,3,4].map(i=>`<th class="n">${rp(sm(i))}</th>`).join('')}</tr>`;$('#fo').innerHTML=`<p><b>Saldo Terkini: ${rp(sm(4))}</b><br><i>Terbilang: ${tbr(sm(4))||'-'}</i></p>`};fill()};
const expK=()=>ex([['NIS','Nama','Kelas','Saldo Bulan Lalu','Pemasukan','Penarikan','Saldo'],...krows().map(a=>[a[0].nis,cap(a[0].nama.toLowerCase()),kn(a[0]),...a.slice(1)])],'rekap-kelas');
PG.naik=()=>{S.naik=S.naik||{};const ys=[];for(let y=2027;y<=Math.max(2027,ay(today())+2);y++)ys.push(y);$('#app').innerHTML=`<h2>⬆️ Kenaikan Kelas</h2><div class="card"><p>Pilih tahun pelajaran tujuan lalu proses kenaikan kelas kolektif seluruh siswa. Saldo akhir tiap siswa otomatis menjadi saldo awal tahun berikutnya. Siswa kelas 6 yang naik menjadi alumni (tidak aktif).</p><div class="bar"><select id="ny">${ys.map(y=>`<option value="${y}" ${y==Y?'selected':''}>${y}/${y+1}${S.naik[y]?' ✅ sudah diproses':''}</option>`).join('')}</select><button onclick="nk(1)">⬆️ Proses Naik Kelas</button><button class="r" onclick="nk(0)">↩️ Batal Proses</button></div></div>`};
const nk=f=>{const y=+g('ny');if(f&&S.naik[y])return toast('Sudah diproses',0);if(!f&&!S.naik[y])return toast('Belum diproses',0);if(!confirm((f?'Proses':'Batalkan')+' kenaikan kelas TP '+y+'/'+(y+1)+'?'))return;if(f)S.naik[y]=true;else delete S.naik[y];save();toast(f?'Kenaikan kelas berhasil':'Proses dibatalkan');PG.naik()};
const jr=()=>{const A=sorted().map(s=>({s,n:T(s,t=>t.j=='S'&&ay(t.tgl)==Y).length,tot:inY(s,'S'),sl:sal(s)}));return[A.filter(x=>x.n).sort((a,b)=>b.n-a.n||b.tot-a.tot).slice(0,3),A.filter(x=>x.sl>0).sort((a,b)=>b.sl-a.sl).slice(0,3)]};
const certH=(s,r,k)=>{const c=S.set;return`<div class="cert"><svg viewBox="0 0 800 530" preserveAspectRatio="xMidYMid slice" style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1"><circle cx="0" cy="0" r="170" fill="#14b8a6" opacity=".18"/><circle cx="800" cy="530" r="200" fill="#3b82f6" opacity=".15"/><path d="M0 440Q200 380 400 450T800 420V530H0Z" fill="#10b981" opacity=".18"/><path d="M0 60Q220 120 420 40T800 90V0H0Z" fill="#2563eb" opacity=".12"/><circle cx="760" cy="60" r="60" fill="none" stroke="#0d9488" stroke-width="6" opacity=".25"/><circle cx="60" cy="480" r="80" fill="none" stroke="#2563eb" stroke-width="5" opacity=".2"/></svg><div style="font-size:52px;line-height:1">🏆</div><div>${c.logo?`<img src="${c.logo}" style="height:42px;vertical-align:middle"> `:''}<b>KEMENTERIAN AGAMA REPUBLIK INDONESIA — ${c.nama.toUpperCase()}</b></div><h1>SERTIFIKAT KEJUARAAN</h1><p>Diberikan kepada</p><h2>${s.nama}</h2><p>Kelas ${kn(s)} — NIS ${s.nis}</p><p>sebagai <b>Juara ${r}</b> Kategori <b>${k?'Tabungan Terbesar':'Penabung Terajin'}</b><br>Tahun Pelajaran ${Y}/${Y+1}</p><p style="font-size:13pt"><i>Terimakasih atas semangat, kedisiplinan, dan keteladanan dalam menabung demi masa depan yang lebih baik</i></p><div class="sl">✦ Menabung hari ini, masa depan lebih baik ✦</div>${ttd()}</div>`};
const ct=(k,i,m)=>{const x=jr()[k][i];$('#kwb').innerHTML=certH(x.s,i+1,k);if(m==1){if(!window.html2canvas)return toast('Pustaka gambar belum termuat',0);html2canvas($('#kwb .cert'),{scale:2,backgroundColor:'#fff'}).then(c=>{const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.95);a.download='sertifikat-'+x.s.nama+'.jpg';a.click()})}else{const e=document.createElement('style');e.textContent='@page{size:A4 landscape;margin:2cm}';document.head.appendChild(e);document.body.classList.add('pk');setTimeout(()=>{window.print();document.body.classList.remove('pk');e.remove()},150)}};
PG.juara=()=>{const J=jr(),t2=(L,k)=>`<table><thead><tr><th>Peringkat</th><th>Nama</th><th>Kelas</th><th>${k?'Saldo':'Jml Setoran / Total'}</th><th class="np">Sertifikat</th></tr></thead><tbody>${L.map((x,i)=>`<tr><td>${['🥇','🥈','🥉'][i]} ${i+1}</td><td>${x.s.nama}</td><td>${kn(x.s)}</td><td>${k?rp(x.sl):x.n+'x / '+rp(x.tot)}</td><td class="np"><button onclick="ct(${k},${i},2)">🖨️ PDF/Cetak</button><button class="g" onclick="ct(${k},${i},1)">🖼️ JPG</button></td></tr>`).join('')||'<tr><td colspan="5">Belum ada data</td></tr>'}</tbody></table>`;
$('#app').innerHTML=`<h2>🏆 Kejuaraan Nabung</h2><div class="bar np"><button onclick="window.print()">🖨️ Cetak Laporan Resmi</button><button class="g" onclick="go('juara')">🔄 Segarkan</button></div><div id="pa" class="card">${kop()}<h3 style="text-align:center">KEJUARAAN MENABUNG TP ${Y}/${Y+1}</h3><h4>🏅 Penabung Terajin (setoran terbanyak)</h4>${t2(J[0],0)}<h4>💎 Tabungan Terbesar</h4>${t2(J[1],1)}${ttd()}</div>`};
['ttdk','ttdb'].forEach(k=>{if(S.set[k]&&!(S.set.cl||{})[k])clean(S.set[k],u=>{S.set[k]=u;S.set.cl=Object.assign(S.set.cl||{},{[k]:1});save()})});
go('dash');
</script></body></html>
